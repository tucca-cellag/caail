name: Repo guards

# The checks that protect the repo's own tooling: the publish-provenance hook,
# and the consistency of the CI path filters themselves. Both are seconds of
# work and need no npm install, so they live here rather than in test.yml.
#
# Splitting them out is not tidiness. They have to trigger on `.github/workflows/**`
# and on the ship skill, and putting those paths on test.yml would have run a full
# Astro build, a Playwright browser install and the axe suite on every SKILL.md
# prose edit or workflow comment tweak — the exact cost that argument rejected
# `.claude/**` for one filter earlier.
on:
  pull_request:
    paths:
      - .claude/hooks/**
      - .claude/settings.json
      # The ship skill's path predictors, and the check that pins them to the
      # workflows. BOTH sides of that check must be able to trigger it, or the
      # guard repeats the defect it exists to catch — and editing docs.yml or
      # lint-papers.yml is precisely what desyncs it.
      - .claude/skills/caail-pr-wrapup/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - .claude/hooks/**
      - .claude/settings.json
      - .claude/skills/caail-pr-wrapup/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # check-ci-paths.py needs PyYAML and refuses to skip silently when it is
      # missing, so the dependency is declared rather than inherited from an
      # undocumented property of the runner image.
      #
      # It has to go through setup-python, NOT `python3 -m pip install`. On
      # ubuntu-latest (24.04) the system interpreter carries PEP 668's
      # EXTERNALLY-MANAGED marker, so pip refuses with
      # `error: externally-managed-environment` before it resolves anything —
      # failing even though PyYAML is already installed on the image. setup-python
      # provides an interpreter pip may write to, and pins the version besides.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      # Resolves the destination's visibility with `gh repo view`. It no longer
      # fails open when it cannot (it announces, scans the payload and denies on
      # risk), so an unauthenticated runner no longer flips tripwire verdicts.
      # The token is still load-bearing: the suite asserts that a destination gh
      # CAN read is announced as read rather than as degraded, which is the check
      # that stops "announces something" passing for both states. Without a token
      # that assertion fails, which is the intended noise.
      - name: Publish-provenance hook guard
        run: python3 .claude/hooks/check-public-publish.test.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even when the step above fails, because that one talks to the
      # GitHub API and a blip there would otherwise skip this on exactly the PRs
      # that edit a workflow, which is when drift is most likely.
      #
      # `!cancelled()` rather than `always()`: the concurrency group sets
      # cancel-in-progress, and `always()` would keep a superseded run grinding
      # through this step instead of stopping.
      - name: CI path filters match the ship skill's predictors
        if: ${{ !cancelled() }}
        run: python .claude/skills/caail-pr-wrapup/check-ci-paths.py

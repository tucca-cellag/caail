name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - site/**
      # '*.md' is ROOT-ONLY in GitHub Actions, so nested canonical directories
      # each need naming. Primers/ was missing: its two files render as live
      # pages (/primers/cell-ag/, /primers/ai/) via primers.json, so a
      # Primers-only change used to lint, test, merge, and never reach a reader
      # until some unrelated push happened to trigger a build.
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      # The correction issue form, for the same reason as Primers/ above. /report/'s
      # composer bakes the error classes the form lists into the built page (they are read
      # at parse time and inlined as a JSON payload), and prefills the chosen one back into
      # the form. So a template-only change lints, tests, merges — and the live page keeps
      # offering an error class that no longer exists, until some unrelated push happens to
      # trigger a build.
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir site install --frozen-lockfile
      - name: Build
        run: pnpm --dir site build
        env:
          PUBLIC_CAAIL_CHAT_API: ${{ vars.PUBLIC_CAAIL_CHAT_API }}
          # Repository variable, not a secret: this URL is compiled into the
          # client bundle by design. Unset, the two usage events no-op.
          PUBLIC_CAAIL_EVENTS_API: ${{ vars.PUBLIC_CAAIL_EVENTS_API }}
      - name: Lighthouse (a11y both; perf landing-only)
        run: pnpm --dir site exec lhci autorun --config=lighthouserc.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

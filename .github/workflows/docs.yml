name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - site/**
      # '*.md' is ROOT-ONLY in GitHub Actions, so nested canonical directories
      # each need naming. Primers/ was missing: its two files render as live
      # pages (/primers/cell-ag/, /primers/ai/) via primers.json, so a
      # Primers-only change used to lint, test, merge, and never reach a reader
      # until some unrelated push happened to trigger a build.
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      - Methods/**
      # The correction issue form, for the same reason as Primers/ above. /report/'s
      # composer bakes the error classes the form lists into the built page (they are read
      # at parse time and inlined as a JSON payload), and prefills the chosen one back into
      # the form. So a template-only change lints, tests, merges — and the live page keeps
      # offering an error class that no longer exists, until some unrelated push happens to
      # trigger a build.
      - .github/ISSUE_TEMPLATE/**
      # `plugin-contribute/**` is deliberately NOT here, and the reason differs from the
      # near-identical note in test.yml -- read both before "fixing" either.
      #
      # `pnpm build` does hard-depend on it: generateData calls verifyContributeForms() first,
      # so drift between the skill and the issue templates fails the build. But adding a trigger
      # here would buy no verification, only a deploy: lint-papers.yml and test.yml both filter
      # on that path, on pull_request AND on push to main, so drift is caught at the moment it
      # lands and attributed to the diff that caused it. Nothing under plugin-contribute/ is
      # published to the site, so a trigger would spend a full build, a Lighthouse run and a
      # Pages deploy to ship a byte-identical site.
      #
      # The residual risk is real but narrow: drift reaching main by a route that skips the PR
      # checks would fail the NEXT unrelated site push at the build step. That push would find
      # lint-papers already red on the offending commit, which is where the attribution lives.
  workflow_dispatch:

# Read-only by default. Only the deploy job below holds the Pages write
# permission and can mint the OIDC token a Pages deployment needs, so neither
# is ever available to the job that installs and runs the build's
# dependencies. That job still decides what the artifact contains, and the
# deploy job publishes it as uploaded.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as deploy-pages' own README recommends. With the upload and the
# deploy as steps of one job, deploy-pages asked for the run's `github-pages`
# artifact under a second after the upload finished, was told there were none,
# and failed; on the run checked afterwards, the artifact was there. That
# happened on pushes and dispatches alike, and
# tucca-cellag/caail-planning#902 holds the runs. `needs: build` makes the
# deploy start only once the build job has finished.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The github-pages environment deploys from main only, and it sits on the
      # deploy job alone, so a dispatch on another branch is stopped here,
      # before anything is built. It fails rather than skips: a skipped run
      # reads as a pass, and this one built and checked nothing.
      - name: Deploy from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::docs.yml deploys from main only. This run on $GITHUB_REF built nothing and ran no Lighthouse."
          exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          # The exact pnpm is the packageManager field of the package.json named
          # below. Do not add a version here.
          package_json_file: site/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir site install --frozen-lockfile
      - name: Build
        run: pnpm --dir site build
        env:
          PUBLIC_CAAIL_CHAT_API: ${{ vars.PUBLIC_CAAIL_CHAT_API }}
          # Repository variable, not a secret: this URL is compiled into the
          # client bundle by design. Unset, the two usage events no-op.
          PUBLIC_CAAIL_EVENTS_API: ${{ vars.PUBLIC_CAAIL_EVENTS_API }}
      - name: Lighthouse (a11y blocks, perf warns; both URLs)
        run: pnpm --dir site exec lhci autorun --config=lighthouserc.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The two permissions deploy-pages needs, and nothing else: a job's own
    # block replaces the workflow's, so this job does not get contents: read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

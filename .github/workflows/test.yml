name: Test site

# The parser suite (vitest) and the browser suite (Playwright + axe) were
# local-only, so a green pipeline said the site built and scored well on
# Lighthouse — not that it worked. Run both on every PR that touches the site or
# the canonical content the parser reads.
on:
  pull_request:
    paths:
      - site/**
      # The events collector Worker has no npm project of its own; its suite
      # runs inside site's vitest (see site/vitest.config.ts), so a change
      # confined to workers/ has to trigger this workflow or it goes untested.
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      - Methods/**
      # The agent guards that ship in this repo, and the settings file that wires
      # them. Until now NOTHING under `.claude/` appeared in any workflow's paths
      # filter or any run step, so a PR touching only a hook triggered nothing at
      # all — including `block-generated-edits.py`, which DOES have a test
      # (site/scripts/db/hook.test.ts) that simply never ran against the change
      # that could break it.
      #
      # Scoped to hooks + settings rather than all of `.claude/`: those are the
      # parts with tests: `block-generated-edits.py` is covered by the vitest
      # suite below, via site/scripts/db/hook.test.ts. (The other hook's test
      # runs in guards.yml, which filters on these same paths.) Skill, rule and
      # agent prose has no test to run, so matching it here would spend a full
      # site build and e2e pass on a doc edit.
      - .claude/hooks/**
      - .claude/settings.json
      - .github/workflows/test.yml
      # The citation record. Two suites read it and fail when a copy of it drifts:
      # project-name.test.ts (the hero eyebrow and the BibTeX block agree with its
      # `title:`) and topic-curators.test.ts (a curator's name and ORCID belong to one
      # author in it). Both were unreachable from CI until this entry existed: a PR
      # editing only CITATION.cff triggered no workflow at all, so neither guard ran on
      # the one edit it exists to catch.
      #
      # What this does NOT buy, stated because the obvious reading is too generous:
      # project-name.test.ts pins exactly TWO copies of the title, the hero eyebrow and
      # citation.ts's BibTeX block. The expansion is hand-typed in several other files
      # that nothing reads, so a retitle still lands with those stale. They are
      # deliberately not listed here — project-name.test.ts's docstring says why an
      # inventory of hand-typed copies is itself a hand-typed copy, and carries the rule
      # (add a copy, add it there). Nor does this cover a plain version or DOI bump,
      # which is the more common release edit: nothing asserts that citation.ts,
      # cite.mdx, README.md and .zenodo.json still agree on `version:` or `doi:`.
      #
      # So: this makes two copies of the title checkable and makes an author/ORCID edit
      # reachable. It does not make a retitle or a release bump safe.
      - CITATION.cff
      # The correction issue form. /report/ composes a report against this file: the error
      # classes its reason field lists ARE the composer's vocabulary, and its field ids are
      # what GitHub prefills by. correction-form.test.ts checks the two agree, and
      # buildCorrectionForm fails the build when they stop agreeing. Without this path
      # a template-only edit triggered NO workflow at all, so the one change most likely
      # to break the composer was the one change nothing ran against.
      - .github/ISSUE_TEMPLATE/**
      # The caail-contribute skill. This IS the exception to the "skill prose has no test to
      # run" note above, and the reason is worth stating because it was got wrong once here:
      # `lint-papers.yml` also filters on this path and its sync-guard step runs `pnpm parse`,
      # which aborts on drift -- so it looks like listing the path here only buys a second run
      # of the same check. It does not. `contribute-form.test.ts` asserts strictly more than
      # parse does: it pins exact SKILL.md prose, because every `stage({skill: ...})` scenario
      # throws when its string edit matches nothing. Rewrapping one line of the resource.yml
      # intro -- a legitimate prose reflow -- leaves `pnpm parse` green and fails two vitest
      # cases. Without this path such a PR merges green and the next unrelated `site/**` PR
      # inherits a red suite blaming a diff that did not cause it.
      - plugin-contribute/**
  push:
    branches: [main]
    paths:
      - site/**
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      - Methods/**
      # The agent guards that ship in this repo, and the settings file that wires
      # them. Until now NOTHING under `.claude/` appeared in any workflow's paths
      # filter or any run step, so a PR touching only a hook triggered nothing at
      # all — including `block-generated-edits.py`, which DOES have a test
      # (site/scripts/db/hook.test.ts) that simply never ran against the change
      # that could break it.
      #
      # Scoped to hooks + settings rather than all of `.claude/`: those are the
      # parts with tests: `block-generated-edits.py` is covered by the vitest
      # suite below, via site/scripts/db/hook.test.ts. (The other hook's test
      # runs in guards.yml, which filters on these same paths.) Skill, rule and
      # agent prose has no test to run, so matching it here would spend a full
      # site build and e2e pass on a doc edit.
      - .claude/hooks/**
      - .claude/settings.json
      - .github/workflows/test.yml
      # The citation record. Two suites read it and fail when a copy of it drifts:
      # project-name.test.ts (the hero eyebrow and the BibTeX block agree with its
      # `title:`) and topic-curators.test.ts (a curator's name and ORCID belong to one
      # author in it). Both were unreachable from CI until this entry existed: a PR
      # editing only CITATION.cff triggered no workflow at all, so neither guard ran on
      # the one edit it exists to catch.
      #
      # What this does NOT buy, stated because the obvious reading is too generous:
      # project-name.test.ts pins exactly TWO copies of the title, the hero eyebrow and
      # citation.ts's BibTeX block. The expansion is hand-typed in several other files
      # that nothing reads, so a retitle still lands with those stale. They are
      # deliberately not listed here — project-name.test.ts's docstring says why an
      # inventory of hand-typed copies is itself a hand-typed copy, and carries the rule
      # (add a copy, add it there). Nor does this cover a plain version or DOI bump,
      # which is the more common release edit: nothing asserts that citation.ts,
      # cite.mdx, README.md and .zenodo.json still agree on `version:` or `doi:`.
      #
      # So: this makes two copies of the title checkable and makes an author/ORCID edit
      # reachable. It does not make a retitle or a release bump safe.
      - CITATION.cff
      # The correction issue form. /report/ composes a report against this file: the error
      # classes its reason field lists ARE the composer's vocabulary, and its field ids are
      # what GitHub prefills by. correction-form.test.ts checks the two agree, and
      # buildCorrectionForm fails the build when they stop agreeing. Without this path
      # a template-only edit triggered NO workflow at all, so the one change most likely
      # to break the composer was the one change nothing ran against.
      - .github/ISSUE_TEMPLATE/**
      # The caail-contribute skill. This IS the exception to the "skill prose has no test to
      # run" note above, and the reason is worth stating because it was got wrong once here:
      # `lint-papers.yml` also filters on this path and its sync-guard step runs `pnpm parse`,
      # which aborts on drift -- so it looks like listing the path here only buys a second run
      # of the same check. It does not. `contribute-form.test.ts` asserts strictly more than
      # parse does: it pins exact SKILL.md prose, because every `stage({skill: ...})` scenario
      # throws when its string edit matches nothing. Rewrapping one line of the resource.yml
      # intro -- a legitimate prose reflow -- leaves `pnpm parse` green and fails two vitest
      # cases. Without this path such a PR merges green and the next unrelated `site/**` PR
      # inherits a red suite blaming a diff that did not cause it.
      - plugin-contribute/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The events collector Worker's behaviour is covered by the vitest suite in the
  # `test` job, but vitest neither typechecks nor reads wrangler.toml. That
  # matters more than usual here: the rate limit lives in the config, not the
  # code, so a typo in the [[ratelimits]] block would disable it while every test
  # still passed. `wrangler deploy --dry-run` bundles the Worker and resolves its
  # bindings without contacting Cloudflare. Its own job so it does not queue
  # behind the browser suite.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/events/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir workers/events install --frozen-lockfile
      - name: Validate bindings and bundle
        run: pnpm --dir workers/events check
        env:
          # A dry run needs no Cloudflare credentials. This only stops wrangler
          # phoning home from CI.
          WRANGLER_SEND_METRICS: 'false'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # metrics.json folds in a git momentum snapshot at build time.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir site install --frozen-lockfile

      # Build first, and not only for the e2e server. `pnpm build` runs the
      # parser, and the generated JSON under src/content/data/ is gitignored, so
      # on a clean checkout it does not exist yet. Both suites need it:
      # src/lib/structured-data.test.ts imports catalog.json/papers.json/
      # talks.json directly, and the e2e ground truths read the same files (see
      # site/e2e/data.ts). Locally these pass without a build only because an
      # earlier build left the artifacts behind.
      - name: Build
        run: pnpm --dir site build
        env:
          # The chat widget reads PUBLIC_CAAIL_CHAT_API at BUILD time (Astro
          # inlines it), and `canSubmit` ends in `&& !!CHAT_API`. Without a value
          # the submit path is unreachable, so e2e/chat-widget.spec.ts could only
          # ever test the closed button. A placeholder makes it reachable.
          #
          # `.invalid` is reserved by RFC 2606 and never resolves, and every
          # request is stubbed with page.route(), so no service is contacted — and
          # if a stub is ever missed the test fails loudly instead of escaping to
          # a real endpoint. The production URL is injected separately in
          # docs.yml from a repository variable.
          PUBLIC_CAAIL_CHAT_API: https://chat.invalid/caail/ask

      - name: Unit + parser tests
        run: pnpm --dir site test

      - name: Install Playwright browser
        run: pnpm --dir site exec playwright install --with-deps chromium

      - name: End-to-end + accessibility tests
        run: pnpm --dir site test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

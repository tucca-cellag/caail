  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The events collector Worker's behaviour is covered by the vitest suite in the
  # `test` job, but vitest neither typechecks nor reads wrangler.toml. That
  # matters more than usual here: the rate limit lives in the config, not the
  # code, so a typo in the [[ratelimits]] block would disable it while every test
  # still passed. `wrangler deploy --dry-run` bundles the Worker and resolves its
  # bindings without contacting Cloudflare. Its own job so it does not queue
  # behind the browser suite.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/events/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir workers/events install --frozen-lockfile
      - name: Validate bindings and bundle
        run: pnpm --dir workers/events check
        env:
          # A dry run needs no Cloudflare credentials. This only stops wrangler
          # phoning home from CI.
          WRANGLER_SEND_METRICS: 'false'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # metrics.json folds in a git momentum snapshot at build time.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir site install --frozen-lockfile

      # Build first, and not only for the e2e server. `pnpm build` runs the
      # parser, and the generated JSON under src/content/data/ is gitignored, so
      # on a clean checkout it does not exist yet. Both suites need it:
      # src/lib/structured-data.test.ts imports catalog.json/papers.json/
      # talks.json directly, and the e2e ground truths read the same files (see
      # site/e2e/data.ts). Locally these pass without a build only because an
      # earlier build left the artifacts behind.
      - name: Build
        run: pnpm --dir site build
        env:
          # The chat widget reads PUBLIC_CAAIL_CHAT_API at BUILD time (Astro
          # inlines it), and `canSubmit` ends in `&& !!CHAT_API`. Without a value
          # the submit path is unreachable, so e2e/chat-widget.spec.ts could only
          # ever test the closed button. A placeholder makes it reachable.
          #
          # `.invalid` is reserved by RFC 2606 and never resolves, and every
          # request is stubbed with page.route(), so no service is contacted — and
          # if a stub is ever missed the test fails loudly instead of escaping to
          # a real endpoint. The production URL is injected separately in
          # docs.yml from a repository variable.
          PUBLIC_CAAIL_CHAT_API: https://chat.invalid/caail/ask

      - name: Unit + parser tests
        run: pnpm --dir site test

      - name: Install Playwright browser
        run: pnpm --dir site exec playwright install --with-deps chromium

      - name: End-to-end + accessibility tests
        run: pnpm --dir site test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

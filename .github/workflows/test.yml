name: Test site

# The parser suite (vitest) and the browser suite (Playwright + axe) were
# local-only, so a green pipeline said the site built and scored well on
# Lighthouse — not that it worked. Run both on every PR that touches the site or
# the canonical content the parser reads.
on:
  pull_request:
    paths:
      - site/**
      # The events collector Worker has no npm project of its own; its suite
      # runs inside site's vitest (see site/vitest.config.ts), so a change
      # confined to workers/ has to trigger this workflow or it goes untested.
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      # The agent guards that ship in this repo, and the settings file that wires
      # them. Until now NOTHING under `.claude/` appeared in any workflow's paths
      # filter or any run step, so a PR touching only a hook triggered nothing at
      # all — including `block-generated-edits.py`, which DOES have a test
      # (site/scripts/db/hook.test.ts) that simply never ran against the change
      # that could break it.
      #
      # Scoped to hooks + settings rather than all of `.claude/`: those are the
      # parts with tests, and both the `hooks` job and the vitest suite in `test`
      # need to run on them. Skill, rule and agent prose has no test to run, so
      # matching it here would spend a full site build and e2e pass on a doc edit.
      - .claude/hooks/**
      - .claude/settings.json
      # The ship skill's path predictors and the check that pins them to these
      # workflows. Both sides of that check have to be able to trigger it, or the
      # guard repeats the defect it exists to catch: ALL workflows, not just this
      # one, since editing docs.yml or lint-papers.yml is exactly what desyncs it.
      - .claude/skills/caail-pr-wrapup/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - site/**
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      # The agent guards that ship in this repo, and the settings file that wires
      # them. Until now NOTHING under `.claude/` appeared in any workflow's paths
      # filter or any run step, so a PR touching only a hook triggered nothing at
      # all — including `block-generated-edits.py`, which DOES have a test
      # (site/scripts/db/hook.test.ts) that simply never ran against the change
      # that could break it.
      #
      # Scoped to hooks + settings rather than all of `.claude/`: those are the
      # parts with tests, and both the `hooks` job and the vitest suite in `test`
      # need to run on them. Skill, rule and agent prose has no test to run, so
      # matching it here would spend a full site build and e2e pass on a doc edit.
      - .claude/hooks/**
      - .claude/settings.json
      # The ship skill's path predictors and the check that pins them to these
      # workflows. Both sides of that check have to be able to trigger it, or the
      # guard repeats the defect it exists to catch: ALL workflows, not just this
      # one, since editing docs.yml or lint-papers.yml is exactly what desyncs it.
      - .claude/skills/caail-pr-wrapup/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The publish-provenance guard ships in this repo (wired through the committed
  # .claude/settings.json) so it protects anyone who clones, not only the machine
  # it was written on. Its test shipped with it and **no workflow had ever run
  # it** — which is the defect this job closes. A guardrail CI never executes is
  # a claim of coverage rather than coverage, and the rule file citing that test
  # is what made it look covered.
  #
  # GH_TOKEN is required, not decorative. The hook resolves the destination's
  # visibility with `gh repo view` and deliberately fails OPEN when it cannot
  # (see its "Resolve the destination repo" block). On an unauthenticated runner
  # every deny case silently becomes an allow: measured 2026-08-12, four of the
  # eight tripwire cases flipped. Without a token this job would go red and blame
  # the hook for an environment problem. The default token can read this repo's
  # own visibility, which is all the hook asks for.
  #
  # The test skips its cross-copy checks when ~/.claude/hooks/ is absent, which
  # is always true on a runner. So CI gates the hook's tripwire precision and its
  # fail-open safety; the byte-identity check stays a local diagnostic by nature,
  # since it compares against a file that only exists on a maintainer's machine.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish-provenance hook guard
        run: python3 .claude/hooks/check-public-publish.test.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ship-pr.sh duplicates every workflow's `paths:` so preflight can predict
      # which jobs a PR triggers. That duplication drifted three times while
      # carrying a comment warning that it drifts, twice predicting "no job" where
      # one runs. Set-compares the two rather than evaluating globs.
      - name: CI path filters match the ship skill's predictors
        run: python3 .claude/skills/caail-pr-wrapup/check-ci-paths.py

  # The events collector Worker's behaviour is covered by the vitest suite in the
  # `test` job, but vitest neither typechecks nor reads wrangler.toml. That
  # matters more than usual here: the rate limit lives in the config, not the
  # code, so a typo in the [[ratelimits]] block would disable it while every test
  # still passed. `wrangler deploy --dry-run` bundles the Worker and resolves its
  # bindings without contacting Cloudflare. Its own job so it does not queue
  # behind the browser suite.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/events/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir workers/events install --frozen-lockfile
      - name: Validate bindings and bundle
        run: pnpm --dir workers/events check
        env:
          # A dry run needs no Cloudflare credentials. This only stops wrangler
          # phoning home from CI.
          WRANGLER_SEND_METRICS: 'false'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # metrics.json folds in a git momentum snapshot at build time.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir site install --frozen-lockfile

      # Build first, and not only for the e2e server. `pnpm build` runs the
      # parser, and the generated JSON under src/content/data/ is gitignored, so
      # on a clean checkout it does not exist yet. Both suites need it:
      # src/lib/structured-data.test.ts imports catalog.json/papers.json/
      # talks.json directly, and the e2e ground truths read the same files (see
      # site/e2e/data.ts). Locally these pass without a build only because an
      # earlier build left the artifacts behind.
      - name: Build
        run: pnpm --dir site build
        env:
          # The chat widget reads PUBLIC_CAAIL_CHAT_API at BUILD time (Astro
          # inlines it), and `canSubmit` ends in `&& !!CHAT_API`. Without a value
          # the submit path is unreachable, so e2e/chat-widget.spec.ts could only
          # ever test the closed button. A placeholder makes it reachable.
          #
          # `.invalid` is reserved by RFC 2606 and never resolves, and every
          # request is stubbed with page.route(), so no service is contacted — and
          # if a stub is ever missed the test fails loudly instead of escaping to
          # a real endpoint. The production URL is injected separately in
          # docs.yml from a repository variable.
          PUBLIC_CAAIL_CHAT_API: https://chat.invalid/caail/ask

      - name: Unit + parser tests
        run: pnpm --dir site test

      - name: Install Playwright browser
        run: pnpm --dir site exec playwright install --with-deps chromium

      - name: End-to-end + accessibility tests
        run: pnpm --dir site test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

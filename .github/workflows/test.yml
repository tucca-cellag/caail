name: Test site

# The parser suite (vitest) and the browser suite (Playwright + axe) were
# local-only, so a green pipeline said the site built and scored well on
# Lighthouse — not that it worked. Run both on every PR that touches the site or
# the canonical content the parser reads.
on:
  pull_request:
    paths:
      - site/**
      # The events collector Worker has no npm project of its own; its suite
      # runs inside site's vitest (see site/vitest.config.ts), so a change
      # confined to workers/ has to trigger this workflow or it goes untested.
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      - Methods/**
      # The agent guards that ship in this repo, and the settings file that wires
      # them. Until now NOTHING under `.claude/` appeared in any workflow's paths
      # filter or any run step, so a PR touching only a hook triggered nothing at
      # all — including `block-generated-edits.py`, which DOES have a test
      # (site/scripts/db/hook.test.ts) that simply never ran against the change
      # that could break it.
      #
      # Scoped to the parts of `.claude/` that HAVE a test, rather than all of it:
      # `block-generated-edits.py` is covered by the vitest suite below, via
      # site/scripts/db/hook.test.ts. (The other hook's test runs in guards.yml,
      # which filters on these same paths.) Most skill, rule and agent prose has
      # no test to run, so matching all of `.claude/` would spend a full site
      # build and e2e pass on a doc edit.
      #
      # The extraction skill is the exception, and is listed for the same reason
      # the hooks are. `site/scripts/parser/curation-page.test.ts` reads FOUR files
      # from it and fails when they disagree with what /curation/ publishes: the
      # README (coverage figures) and three scripts (ref 51's page count, which
      # exists in five places and was wrong in all five for weeks).
      #
      # THE LIST IS THE GUARD'S SOURCES, ENUMERATED, and it has already been wrong
      # once in each direction. First the whole subtree, which spent a full site
      # build and Playwright run on every Python edit for coverage of one file.
      # Then README.md alone, which left 3 of the 4 unreachable — and commit
      # 84ef88d in this very branch touched exactly those three Python files and
      # nothing else, so a PR shaped like that would have merged green with the
      # five copies disagreeing. Keep this list equal to the test's SOURCES.
      - .claude/hooks/**
      - .claude/settings.json
      - .claude/skills/matrix-classification-audit/README.md
      - .claude/skills/matrix-classification-audit/docling_sections.py
      - .claude/skills/matrix-classification-audit/docling_sections.test.py
      - .claude/skills/matrix-classification-audit/extract_matrix_corpus.py
      - .github/workflows/test.yml
      # The two ignore files, because canonical-files.test.ts now asserts they
      # agree with the code about what a private companion is (the publishing rule in CLAUDE.md).
      # Without these entries the guard never runs on the edit most likely to
      # break it: a PR that deletes the `*.local.mdx` line from .gitignore
      # touches no other path, triggers zero workflows, merges green, and makes
      # the commonest companion committable into this public repo. Same defect
      # the `.claude/hooks/**` note above describes — a test that exists and is
      # unreachable from CI.
      - .gitignore
      - .worktreeinclude
      # .env.example, for a DIFFERENT reason than the two above: the
      # publishable set asserts every one of its entries exists on disk,
      # and this is one of them. Without a filter here, renaming or
      # deleting it in a PR touching nothing else merges green and hands
      # the red suite to the next unrelated site/** change.
      - .env.example
      # The citation record. Two suites read it and fail when a copy of it drifts:
      # project-name.test.ts, which pins the title, and topic-curators.test.ts, which
      # checks a curator's name and ORCID belong to one author in it. Both were
      # unreachable from CI until this entry existed: a PR editing only CITATION.cff
      # triggered no workflow at all, so neither guard ran on the one edit it exists
      # to catch.
      #
      # What this does NOT buy, stated because the obvious reading is too generous:
      # project-name.test.ts pins SOME of the hand-typed copies of the title, not all
      # of them, so a retitle still lands with the rest stale. Which ones are covered
      # is deliberately not restated here — read that file's docstring, which is also
      # where the rule lives (add a copy, add it there). An earlier version of this
      # comment named the covered set and a later commit changed it, so the count was
      # wrong here, twice over, while both copies of this block still read correctly.
      #
      # Nor does this cover a plain version or DOI bump, which is the more common
      # release edit: nothing asserts that citation.ts, cite.mdx, README.md and
      # .zenodo.json still agree on `version:` or `doi:`.
      #
      # WHY THIS FILE AND NOT .zenodo.json, which carries the same strings and is
      # deliberately left out. The cost is identical and real — a full build and a
      # browser install for a handful of file reads, which is CAAIL-298 — so the
      # asymmetry needs a reason rather than a preference. It is blast radius.
      # CITATION.cff is the SOURCE every pin compares against, so an edit to it alone
      # changes the expected value of all of them at once and can leave the repo
      # inconsistent in half a dozen places. .zenodo.json is a leaf: an edit to it can
      # only make itself wrong, and the realistic retitle starts at CITATION.cff and
      # so trips this filter anyway. One is the thing that moves everything; the other
      # is one of the things that move. CAAIL-301 holds the decision to revisit it.
      - CITATION.cff
      # The correction issue form. /report/ composes a report against this file: the error
      # classes its reason field lists ARE the composer's vocabulary, and its field ids are
      # what GitHub prefills by. correction-form.test.ts checks the two agree, and
      # buildCorrectionForm fails the build when they stop agreeing. Without this path
      # a template-only edit triggered NO workflow at all, so the one change most likely
      # to break the composer was the one change nothing ran against.
      - .github/ISSUE_TEMPLATE/**
      # The caail-contribute skill. This IS the exception to the "skill prose has no test to
      # run" note above, and the reason is worth stating because it was got wrong once here:
      # `lint-papers.yml` also filters on this path and its sync-guard step runs `pnpm parse`,
      # which aborts on drift -- so it looks like listing the path here only buys a second run
      # of the same check. It does not. `contribute-form.test.ts` asserts strictly more than
      # parse does: it pins exact SKILL.md prose, because every `stage({skill: ...})` scenario
      # throws when its string edit matches nothing. Rewrapping one line of the resource.yml
      # intro -- a legitimate prose reflow -- leaves `pnpm parse` green and fails two vitest
      # cases. Without this path such a PR merges green and the next unrelated `site/**` PR
      # inherits a red suite blaming a diff that did not cause it.
      - plugin-contribute/**
  push:
    branches: [main]
    paths:
      - site/**
      - workers/**
      - '*.md'
      - ResearchAreas/**
      - Datasets/**
      - Primers/**
      - Methods/**
      # The agent guards that ship in this repo, and the settings file that wires

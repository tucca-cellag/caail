name: Papers matrix lint

on:
  pull_request:
    paths:
      - Papers.md
      - Software.md
      - Databases.md
      - OtherResources.md
      - Datasets/**
      - CONTRIBUTING.md
      - CLAUDE.md
      # the matrix axis definitions. db:check's axis guard and the agent-API sync
      # guard both read this file, so a PR editing ONLY Taxonomy.md (rewording a
      # column's scope, adding a `### Heading`, introducing a duplicate) would
      # otherwise skip both: the committed taxonomy.json would go stale while the
      # plugin skill still points installed agents at it, and the next unrelated
      # contributor would inherit a red CI on a diff they did not cause.
      - Taxonomy.md
      - site/scripts/parser/**
      - site/scripts/db/**
      - site/db/**
      # generated outputs, so a hand-edit trips the sync guard that catches it
      - site/public/api/**
      - site/public/setup.md
      - plugin/skills/**
      # the installer, which setup.md is generated from. It lives outside plugin/ so that
      # installing the plugin does not also install its own installer, which means it is
      # NOT covered by the line above: without this a lone edit to it would skip the
      # agent-API sync guard and ship a stale setup.md with nothing to say so.
      - skills/**
  push:
    branches:
      - main
    paths:
      - Papers.md
      - Software.md
      - Databases.md
      - OtherResources.md
      - Datasets/**
      - CONTRIBUTING.md
      - CLAUDE.md
      # the matrix axis definitions. db:check's axis guard and the agent-API sync
      # guard both read this file, so a PR editing ONLY Taxonomy.md (rewording a
      # column's scope, adding a `### Heading`, introducing a duplicate) would
      # otherwise skip both: the committed taxonomy.json would go stale while the
      # plugin skill still points installed agents at it, and the next unrelated
      # contributor would inherit a red CI on a diff they did not cause.
      - Taxonomy.md
      - site/scripts/parser/**
      - site/scripts/db/**
      - site/db/**
      # generated outputs, so a hand-edit trips the sync guard that catches it
      - site/public/api/**
      - site/public/setup.md
      - plugin/skills/**
      # the installer, which setup.md is generated from. It lives outside plugin/ so that
      # installing the plugin does not also install its own installer, which means it is
      # NOT covered by the line above: without this a lone edit to it would skip the
      # agent-API sync guard and ship a stale setup.md with nothing to say so.
      - skills/**
  workflow_dispatch:

concurrency:
  group: lint-papers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Papers.md matrix ↔ references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the agent-API sync guard below regenerates corpusDate from
          # `git log -- site/db/ndjson`, and in a depth-1 clone that returns the TIP
          # commit's date (the graft root "touches" every path) rather than the real
          # last-touch date. It is well-formed, so nothing catches it, and the guard
          # then diffs a wrong date against the committed one. docs.yml and test.yml
          # already set this for the same reason.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir site install --frozen-lockfile

      - name: Run Papers.md lint
        run: pnpm --dir site lint:papers

      - name: DB integrity + round-trip verify
        run: |
          pnpm --dir site db:check
          pnpm --dir site db:verify

      - name: DB ↔ Markdown sync guard
        run: |
          pnpm --dir site db:emit
          git diff --exit-code -- Papers.md Software.md Databases.md 'Datasets/*.md' \
            || { echo "::error::Committed Markdown is out of sync with the DB. Run 'pnpm --dir site db:emit' and commit the result."; exit 1; }

      - name: Agent API ↔ corpus sync guard
        run: |
          pnpm --dir site parse
          git diff --exit-code -- site/public/api site/public/setup.md \
            || { echo "::error::Committed agent API is out of sync with the corpus. Run 'pnpm --dir site parse' and commit the result."; exit 1; }

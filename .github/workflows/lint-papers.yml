name: Papers matrix lint

on:
  pull_request:
    paths:
      - Papers.md
      - Software.md
      - Databases.md
      - FieldReports.md
      - OtherResources.md
      - Datasets/**
      - CONTRIBUTING.md
      - CLAUDE.md
      # the matrix axis definitions. db:check's axis guard and the agent-API sync
      # guard both read this file, so a PR editing ONLY Taxonomy.md (rewording a
      # column's scope, adding a `### Heading`, introducing a duplicate) would
      # otherwise skip both: the committed taxonomy.json would go stale while the
      # plugin skill still points installed agents at it, and the next unrelated
      # contributor would inherit a red CI on a diff they did not cause.
      - Taxonomy.md
      - site/scripts/parser/**
      - site/scripts/db/**
      - site/db/**
      # the site's address. Parse writes SITE_URL into the agent API and llms.txt's
      # corpus-date line, so a lone edit here changes output the sync guard diffs.
      - site/src/content/site-config.ts
      # generated outputs, so a hand-edit trips the sync guard that catches it
      - site/public/api/**
      - site/public/setup.md
      - site/public/llms.txt
      - plugin/skills/**
      # the installer, which setup.md is generated from. It lives outside plugin/ so that
      # installing the plugin does not also install its own installer, which means it is
      # NOT covered by the line above: without this a lone edit to it would skip the
      # agent-API sync guard and ship a stale setup.md with nothing to say so.
      - skills/**
      # the corpus extraction scripts. docling_sections.test.py runs here because it
      # needs neither Zotero nor the network -- it reads committed heading fixtures.
      - .claude/skills/matrix-classification-audit/**
      # the main-PDF rule every corpus script reads a paper's text through, and
      # the one other script that reads it (scope.test.py guards both).
      - .claude/skills/zotero-collection-scope/**
      - .claude/skills/papers-dataset-audit/**
      # the caail-contribute skill and the issue forms it composes URLs for. `pnpm parse`
      # now ABORTS when the two disagree (contribute-form.ts), and the sync guard step
      # below runs parse -- so without these two paths a skill-only or template-only
      # change could reach main untested and then surface as a red "Agent API <-> corpus
      # sync guard" on the next unrelated Papers.md PR, blaming a diff that did not cause
      # it. Same class as the Taxonomy.md comment above.
      - plugin-contribute/**
      - .github/ISSUE_TEMPLATE/**
      # this workflow itself, since the new-item guard's logic lives in it (its base,
      # continue-on-error, the result step). Without it a PR that changes only that
      # logic never runs it, and a base that comes out empty skips the guard on every
      # later run with only a notice.
      - .github/workflows/lint-papers.yml
  push:
    branches:
      - main
    paths:
      - Papers.md
      - Software.md
      - Databases.md
      - FieldReports.md
      - OtherResources.md
      - Datasets/**
      - CONTRIBUTING.md
      - CLAUDE.md
      # the matrix axis definitions. db:check's axis guard and the agent-API sync
      # guard both read this file, so a PR editing ONLY Taxonomy.md (rewording a
      # column's scope, adding a `### Heading`, introducing a duplicate) would
      # otherwise skip both: the committed taxonomy.json would go stale while the
      # plugin skill still points installed agents at it, and the next unrelated
      # contributor would inherit a red CI on a diff they did not cause.
      - Taxonomy.md
      - site/scripts/parser/**
      - site/scripts/db/**
      - site/db/**
      # the site's address. Parse writes SITE_URL into the agent API and llms.txt's
      # corpus-date line, so a lone edit here changes output the sync guard diffs.
      - site/src/content/site-config.ts
      # generated outputs, so a hand-edit trips the sync guard that catches it
      - site/public/api/**
      - site/public/setup.md
      - site/public/llms.txt
      - plugin/skills/**
      # the installer, which setup.md is generated from. It lives outside plugin/ so that
      # installing the plugin does not also install its own installer, which means it is
      # NOT covered by the line above: without this a lone edit to it would skip the
      # agent-API sync guard and ship a stale setup.md with nothing to say so.
      - skills/**
      # the corpus extraction scripts. docling_sections.test.py runs here because it
      # needs neither Zotero nor the network -- it reads committed heading fixtures.
      - .claude/skills/matrix-classification-audit/**
      # the main-PDF rule every corpus script reads a paper's text through, and
      # the one other script that reads it (scope.test.py guards both).
      - .claude/skills/zotero-collection-scope/**
      - .claude/skills/papers-dataset-audit/**
      # the caail-contribute skill and the issue forms it composes URLs for. `pnpm parse`
      # now ABORTS when the two disagree (contribute-form.ts), and the sync guard step
      # below runs parse -- so without these two paths a skill-only or template-only
      # change could reach main untested and then surface as a red "Agent API <-> corpus
      # sync guard" on the next unrelated Papers.md PR, blaming a diff that did not cause
      # it. Same class as the Taxonomy.md comment above.
      - plugin-contribute/**
      - .github/ISSUE_TEMPLATE/**
      # this workflow itself, since the new-item guard's logic lives in it (its base,
      # continue-on-error, the result step). Without it a PR that changes only that
      # logic never runs it, and a base that comes out empty skips the guard on every
      # later run with only a notice.
      - .github/workflows/lint-papers.yml
  workflow_dispatch:

concurrency:
  # One group per pull request, so a new push cancels the stale run. A push to main gets a
  # group of its own commit instead: the new-item guard compares each push with the one
  # before it, so a push whose run was cancelled, or replaced while pending (which a shared
  # group does even without cancel-in-progress), would have its commits checked by nothing.
  group: lint-papers-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Papers.md matrix ↔ references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the agent-API sync guard below regenerates corpusDate from
          # `git log -- site/db/ndjson`, and in a depth-1 clone that returns the TIP
          # commit's date (the graft root "touches" every path) rather than the real
          # last-touch date. It is well-formed, so nothing catches it, and the guard
          # then diffs a wrong date against the committed one. docs.yml and test.yml
          # already set this for the same reason.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          # The exact pnpm is the packageManager field of the package.json named
          # below. Do not add a version here.
          package_json_file: site/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir site install --frozen-lockfile

      # While new items are paused until CAAIL v2 (NEW_ITEMS_PAUSED in
      # site/scripts/db/add-item.ts), refuse a change that adds an item id or a
      # Data on request study to the NDJSON, however it got there, compared with the
      # tree it adds to: the merge commit's first parent on a pull request, the
      # previous tip on a push. (An entry added to the Markdown alone fails the sync
      # guard below instead.)
      # A correction that adds an id declares it in a commit trailer, "Splits:"
      # for a split of a held item, "Re-mints:" for a repaired id (see
      # check-new-items.ts). The base goes through env rather than into the script.
      # It runs straight after install, before every other check, so a failure in one
      # of them cannot skip it on a push to main, whose next run compares only with
      # this push's tip. continue-on-error lets those checks still run after a refusal;
      # the job's last step fails it on the refusal instead.
      - name: New-item guard
        id: new-item-guard
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base commit to compare against, so the new-item guard did not run."
            exit 0
          fi
          pnpm --dir site db:check-new-items "$BASE"

      - name: Run Papers.md lint
        run: pnpm --dir site lint:papers

      # The methods-section extractor the matrix re-audit reads its evidence from.
      # Runs here rather than nowhere: it is stdlib-only and reads committed heading
      # fixtures, so it needs neither Zotero nor the network. A guard no workflow
      # invokes is the defect tucca-cellag/caail-planning#197 was opened to fix; this one is invoked.
      - name: Methods-section extraction tests
        run: python3 .claude/skills/matrix-classification-audit/docling_sections.test.py

      # The other half of the same chain: what a located availability statement
      # yields. Same reason it can run here -- stdlib only, no Zotero, no
      # network, no gitignored corpus. It also guards that this directory's
      # README lists every script in it, which had already drifted.
      - name: Accession-extraction tests
        run: python3 .claude/skills/matrix-classification-audit/extract_accessions.test.py

      # Which Zotero attachment is a paper's own text. Every script above reads
      # through scope.select_main_pdf, and a tagged supplement must never be
      # converted as the paper (tucca-cellag/caail-planning#404). Stdlib only, no Zotero, no network.
      - name: Main-PDF selection tests
        run: python3 .claude/skills/zotero-collection-scope/scope.test.py

      # The ingest's one-file entry point (--file PATH --ref N), which the shared
      # intake calls with Europe PMC JATS. Docling is not installed here, so this
      # covers what is decided before conversion: the suffix gate, the refused
      # argument combinations, and each section's recorded source.
      - name: Ingest entry-point tests
        run: python3 .claude/skills/matrix-classification-audit/docling_ingest.test.py

      - name: DB integrity + round-trip verify
        run: |
          pnpm --dir site db:check
          pnpm --dir site db:verify

      - name: DB ↔ Markdown sync guard
        run: |
          pnpm --dir site db:emit
          git diff --exit-code -- Papers.md Software.md Databases.md FieldReports.md 'Datasets/*.md' \
            || { echo "::error::Committed Markdown is out of sync with the DB. Run 'pnpm --dir site db:emit' and commit the result."; exit 1; }

      - name: Agent API ↔ corpus sync guard
        run: |
          pnpm --dir site parse
          git diff --exit-code -- site/public/api site/public/setup.md site/public/llms.txt \
            || { echo "::error::Committed site/public/api, site/public/setup.md or site/public/llms.txt is out of sync with the corpus. Run 'pnpm --dir site parse' and commit the result."; exit 1; }

      - name: New-item guard result
        if: ${{ !cancelled() && steps.new-item-guard.outcome == 'failure' }}
        run: |
          echo "::error::The new-item guard refused this change. Its step log, near the top of this job, names each new item."
          exit 1
